name: Deploy Portofolio ke GitHub Pages

on:
  # Akan otomatis berjalan setiap kali ada push ke branch 'main'
  push:
    branches: ['main']

# Mengatur hak akses (permissions) yang dibutuhkan GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Membatasi agar hanya satu deployment yang berjalan dalam satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Arahkan ke folder 'dist' tempat Vite menyimpan hasil build
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4